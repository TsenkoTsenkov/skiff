ShortDescription: A fast, native Kubernetes cluster browser
Description: |-
  Skiff is a desktop client for Kubernetes clusters: browse and edit
  resources, follow logs, open shells in containers and forward ports.
  It is a native program, uses the kubeconfig as it is (including exec
  credential plugins and OIDC) and has no account and no telemetry.
