<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Skiff app icon: a small boat (hull plus one sail) on a dark tile.

  This file is the source; every other file in this directory is generated
  from it by hack/icons.sh. The canvas is 1024 x 1024 with the tile inset to
  824 x 824 (the content area Apple's icon grid asks for), so the same
  artwork serves macOS, Windows and Linux. Colours are the app theme's:
  background 0x0E1014, accent 0x5B9DFF.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1014"/>
      <stop offset="0.45" stop-color="#111722"/>
      <stop offset="1" stop-color="#1B2B47"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2DAFF"/>
      <stop offset="1" stop-color="#8DBBFF"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9DFF"/>
      <stop offset="1" stop-color="#3F7FE6"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <!-- A hairline rim so the tile keeps its edge on a dark desktop. -->
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="6"/>
  <!-- Sail: one triangle, leaning into the wind. -->
  <path d="M 478 238 C 600 330 690 440 742 560 L 478 560 Z" fill="url(#sail)" stroke="url(#sail)" stroke-width="28" stroke-linejoin="round"/>
  <!-- Small fore triangle in the accent colour: reads as the same sail's shaded side. -->
  <path d="M 410 330 L 410 560 L 296 560 Z" fill="#5B9DFF" stroke="#5B9DFF" stroke-width="28" stroke-linejoin="round"/>
  <!-- Hull. -->
  <path d="M 246 656 L 778 656 C 752 732 690 776 608 776 L 404 776 C 326 776 270 732 246 656 Z" fill="url(#hull)" stroke="url(#hull)" stroke-width="36" stroke-linejoin="round"/>
</svg>
