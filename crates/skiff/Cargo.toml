[package]
name = "skiff"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A fast, native Kubernetes cluster browser"

[lib]
path = "src/lib.rs"

[[bin]]
name = "skiff"
path = "src/main.rs"

[dependencies]
skiff-core = { path = "../skiff-core" }
skiff-term = { path = "../skiff-term", optional = true }
# Both renderers are compiled in: wgpu is the default, glow (OpenGL) is what
# main.rs falls back to on a machine where wgpu finds nothing to draw with.
eframe = { version = "0.37", features = ["persistence", "glow"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["syntect"] }
egui_material_icons = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[build-dependencies]
# Embeds the icon and version info into skiff.exe (build.rs; Windows targets only).
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }

[features]
default = ["terminal"]
# Embedded terminal for shells inside containers.
terminal = ["dep:skiff-term"]
