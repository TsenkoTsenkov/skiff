[package]
name = "skiff-term"
description = "egui terminal widget for byte-stream (kubectl exec style) sessions"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = "0.37"
alacritty_terminal = { version = "0.26", default-features = false }
unicode-width = "0.2"

[dev-dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
