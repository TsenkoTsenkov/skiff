[package]
name = "skiff-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "UI-independent Kubernetes data layer for Skiff"

[dependencies]
kube = { version = "5.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws", "gzip", "oidc", "http-proxy"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures = "0.3"
http = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
arc-swap = "1"
parking_lot = "0.13"
thiserror = "2"
tracing = "0.1"
indexmap = "2"
memchr = "2"
jiff = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
