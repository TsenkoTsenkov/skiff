# cargo-deny configuration: `cargo deny check` (CI runs it on every pull
# request and once a week, see .github/workflows/ci.yml).
#
# What it guards:
#   advisories  no dependency with a known vulnerability (RustSec database)
#   licenses    only licences compatible with shipping an MIT-licensed binary
#   bans        no OpenSSL / native-tls / cmake-built C libraries creeping in
#               (they would break the cross-builds and the static Windows exe)
#   sources     crates come from crates.io only

[graph]
# The platforms releases are built for; dependencies of other targets are
# not shipped and not checked.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Vulnerabilities and unsound crates always fail. Unmaintained crates fail
# only when they are direct dependencies: a transitive one cannot be fixed
# here and is reported by the weekly run instead.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
# Permissive licences only. No copyleft (GPL/LGPL/MPL): adding one is a
# decision for a person, not a default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    # The fonts egui embeds (epaint_default_fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "TLS is rustls + ring; OpenSSL breaks cross-builds" },
    { crate = "openssl", reason = "TLS is rustls + ring" },
    { crate = "native-tls", reason = "TLS is rustls + ring" },
    { crate = "aws-lc-sys", reason = "needs cmake and a C++ toolchain; ring is used instead" },
    { crate = "cmake", reason = "no cmake-built C libraries" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
