apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-team-a-scratch
  labels: {app.kubernetes.io/managed-by: skiff-seed}
spec:
  capacity: {storage: 5Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath: {path: /mnt/data/pv-team-a-scratch}
  claimRef: {namespace: team-a, name: scratch}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: pv-archive-available}
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Delete
  storageClassName: slow-hdd
  hostPath: {path: /mnt/data/archive}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: scratch, namespace: team-a}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: {requests: {storage: 5Gi}}
  volumeName: pv-team-a-scratch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: uploads-archive, namespace: shop, annotations: {note: "requests more than any PV offers -> stays Pending"}}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: slow-hdd
  resources: {requests: {storage: 100Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: media-cache, namespace: shop}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: fast-ssd
  resources: {requests: {storage: 20Gi}}
