kind: Deployment
metadata: {name: web, namespace: shop, labels: {app: "web", app.kubernetes.io/name: "web", app.kubernetes.io/part-of: "shop", tier: "frontend"}}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector: {matchLabels: {app: web}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 1}}
  template:
    metadata:
      labels: {app: "web", app.kubernetes.io/name: "web", app.kubernetes.io/part-of: "shop", tier: "frontend"}
      annotations: {kwok.x-k8s.io/usage-cpu: "70m", kwok.x-k8s.io/usage-memory: "90Mi"}
    spec:
      serviceAccountName: web
      priorityClassName: business-critical
      initContainers:
      - {name: init-wait, image: busybox:1.36, command: [sh, -c, 'echo waiting for deps; sleep 1']}
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports: [{name: http, containerPort: 80}]
        env:
        - {name: API_URL, value: "http://api:8080"}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 400m, memory: 256Mi}}
        volumeMounts:
        - {name: cfg, mountPath: /etc/nginx/conf.d, readOnly: true}
      volumes:
      - {name: cfg, configMap: {name: web-config}}
