apiVersion: v1
kind: ConfigMap
metadata: {name: web-config, namespace: shop}
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      upstream api { server api:8080; }
      server {
        listen 80;
        location /api/ { proxy_pass http://api; }
        location / { root /usr/share/nginx/html; }
      }
    }
  LOG_LEVEL: |
    info
---
