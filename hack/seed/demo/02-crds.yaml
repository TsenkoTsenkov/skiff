metadata: {name: certificates.pki.skiff.dev}
spec:
  group: pki.skiff.dev
  scope: Namespaced
  names: {plural: certificates, singular: certificate, kind: Certificate, listKind: CertificateList, shortNames: [cert, certs], categories: [skiff]}
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Common Name, type: string, jsonPath: .spec.commonName}
    - {name: Issuer, type: string, jsonPath: .spec.issuerRef.name}
    - {name: Secret, type: string, jsonPath: .spec.secretName}
    - {name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].status'}
    - {name: Expires, type: string, jsonPath: .status.notAfter}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              commonName: {type: string}
              dnsNames: {type: array, items: {type: string}}
              secretName: {type: string}
              issuerRef:
                type: object
                properties:
                  name: {type: string}
                  kind: {type: string}
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
