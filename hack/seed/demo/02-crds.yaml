apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: databases.stack.skiff.dev}
spec:
  group: stack.skiff.dev
  scope: Namespaced
  names: {plural: databases, singular: database, kind: Database, listKind: DatabaseList, shortNames: [db], categories: [skiff]}
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Engine, type: string, jsonPath: .spec.engine}
    - {name: Version, type: string, jsonPath: .spec.version}
    - {name: Replicas, type: integer, jsonPath: .spec.replicas}
    - {name: Storage, type: string, jsonPath: .spec.storage}
    - {name: Phase, type: string, jsonPath: .status.phase}
    - {name: Ready, type: boolean, jsonPath: .status.ready}
    - {name: Endpoint, type: string, jsonPath: .status.endpoint, priority: 1}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [engine]
            properties:
              engine: {type: string, enum: [postgres, mysql, redis, mongodb]}
              version: {type: string}
              replicas: {type: integer, minimum: 1}
              storage: {type: string}
              backup:
                type: object
                properties:
                  enabled: {type: boolean}
                  schedule: {type: string}
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
