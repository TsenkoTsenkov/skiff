# Sends each stable release to the package managers that need a copy of it.
#
#   Homebrew  Casks/skiff.rb    this repository is the tap; hack/bump-version.py
#   Scoop     bucket/skiff.json keeps them current. Nothing to do here.
#   winget    a pull request to microsoft/winget-pkgs, made with Microsoft's
#             wingetcreate, when the secret WINGET_TOKEN exists.
#   AUR       the package skiff-bin, pushed over SSH, when the secret
#             AUR_SSH_PRIVATE_KEY exists.
#
# Runs when the Release workflow has finished on main, and acts only if that
# run built the commit of a stable tag vX.Y.Z (a nightly does nothing). The
# manifests are made by hack/package-manifests.py from the release's
# SHA256SUMS, and are kept with the run either way.
#
# By hand: Actions -> Package managers -> Run workflow, with a version, to
# submit that release again (for example after adding a secret).
# A pull request that changes this file, the script or the templates makes the
# manifests for the latest release and submits nothing.
#
# packaging/README.md says how to get the two secrets. Keep them as secrets
# of the "release" environment, as the signing secrets are.
name: Package managers

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to submit, X.Y.Z"
        required: true
  pull_request:
    paths:
      - ".github/workflows/package-managers.yml"
      - "hack/package-manifests.py"
      - "packaging/winget/**"
      - "packaging/aur/**"

permissions:
  contents: read

jobs:
  manifests:
    name: Make the manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.which.outputs.version }}
      submit: ${{ steps.which.outputs.submit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Which release
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          submit=false
          case "$EVENT" in
            workflow_run)
              version=$(git show "$RUN_SHA:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
              tagged=$(git rev-list -n 1 "refs/tags/v$version" 2>/dev/null || true)
              if [ "$tagged" != "$RUN_SHA" ]; then
                echo "That Release run built a nightly ($RUN_SHA is not v$version); nothing to submit." | tee -a "$GITHUB_STEP_SUMMARY"
                echo "version=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              submit=true
              ;;
            workflow_dispatch)
              version=$INPUT_VERSION
              submit=true
              ;;
            *)
              version=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName | sed 's/^v//')
              ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a version: '$version'."
            exit 1
          fi
          if [ "$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != false ]; then
            echo "::error::v$version is not a published stable release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "submit=$submit" >> "$GITHUB_OUTPUT"
      - name: Fill in the templates
        if: steps.which.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.which.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          date=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt[0:10]')
          python3 hack/package-manifests.py "$VERSION" --sums "$RUNNER_TEMP/SHA256SUMS" --date "$date" --out out
          for f in out/winget/* out/aur/PKGBUILD out/aur/.SRCINFO; do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
          bash -n out/aur/PKGBUILD
      - if: steps.which.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manifests
          path: out/
          include-hidden-files: true
          if-no-files-found: error

  winget:
    name: winget
    needs: manifests
    if: needs.manifests.outputs.submit == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      VERSION: ${{ needs.manifests.outputs.version }}
    steps:
      - name: Is it set up
        id: setup
        shell: pwsh
        run: |
          if ($env:WINGET_TOKEN) { "ok=true" >> $env:GITHUB_OUTPUT }
          else { "No WINGET_TOKEN secret: not submitting to winget (packaging/README.md)." >> $env:GITHUB_STEP_SUMMARY }
      - if: steps.setup.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-manifests
          path: manifests
      # wingetcreate forks microsoft/winget-pkgs into the token owner's
      # account (once) and opens the pull request from there. Microsoft's
      # bots then install the package in a sandbox. aka.ms/wingetcreate/latest
      # is the download Microsoft documents for use in CI.
      - name: Submit to winget
        if: steps.setup.outputs.ok == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $sig = Get-AuthenticodeSignature .\wingetcreate.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "wingetcreate.exe is not validly signed by Microsoft: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: TsenkoTsenkov.Skiff version $env:VERSION" manifests\winget
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed ($LASTEXITCODE)" }

  aur:
    name: AUR
    needs: manifests
    if: needs.manifests.outputs.submit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      VERSION: ${{ needs.manifests.outputs.version }}
    steps:
      - name: Is it set up
        id: setup
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then echo ok=true >> "$GITHUB_OUTPUT"
          else echo "No AUR_SSH_PRIVATE_KEY secret: not publishing to the AUR (packaging/README.md)." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.setup.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-manifests
          path: manifests
      # The host key is checked against the fingerprint the AUR publishes on
      # https://aur.archlinux.org (bottom of the home page).
      - name: Push skiff-bin to the AUR
        if: steps.setup.outputs.ok == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > "$RUNNER_TEMP/aur_host" 2>/dev/null
          fp=$(ssh-keygen -lf "$RUNNER_TEMP/aur_host" | awk '{print $2}')
          if [ "$fp" != "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4" ]; then
            echo "::error::aur.archlinux.org presented an unexpected host key ($fp)."
            exit 1
          fi
          cat "$RUNNER_TEMP/aur_host" >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/skiff-bin.git aur
          cp manifests/aur/PKGBUILD manifests/aur/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "skiff-bin is already at $VERSION."
            exit 0
          fi
          git -c user.name="Skiff release workflow" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update to $VERSION"
          git push origin HEAD:master
