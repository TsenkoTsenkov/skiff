# Publishes the site/ folder to GitHub Pages
# (https://tsenkotsenkov.github.io/skiff/) whenever it changes on main.
#
# The site is plain HTML and CSS: there is no build step, and what is in
# site/ is exactly what is served. The docs/ folder is not published here;
# GitHub renders it in the repository.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions" (docs/releasing.md).
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Nothing is granted by default; the one job below asks for what
# publishing needs.
permissions:
  contents: read

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write      # publish the site
      id-token: write   # prove to Pages that this workflow is the publisher
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The page must not load anything from another host: no fonts, no
      # scripts, no trackers. Links (<a href>) are fine.
      - name: No external requests
        run: |
          if grep -nEi '(src|srcset|poster)\s*=\s*"(https?:)?//|<link[^>]+href\s*=\s*"(https?:)?//|url\(\s*["'"'"']?(https?:)?//|@import' site/*.html site/*.css; then
            echo "::error::site/ loads something from another host (see the lines above)."
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
