# Publishes the site to GitHub Pages (https://tsenkotsenkov.github.io/skiff/)
# whenever it or the documentation changes on main.
#
# The landing page is plain HTML, CSS and one small script, served as it
# is in site/. The documentation pages under /docs/ are generated here
# from docs/*.md by hack/site-build.py (Python, standard library only) and
# are not committed.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions" (docs/releasing.md).
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "hack/site-build.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Nothing is granted by default; the deploy job below asks for what
# publishing needs.
permissions:
  contents: read

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as GitHub's own Pages workflows have it. In one job the deploy
# step asked for the site's artifact less than a second after the upload
# step had stored it, and now and then GitHub's list of the run's
# artifacts did not show it yet ("No artifacts named github-pages were
# found"): the site was not published and the run was red. Starting a
# second job takes longer than that list needs.
jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docs/*.md -> site/docs/*.html. Fails on a link between pages that
      # leads nowhere.
      - name: Build the documentation pages
        run: python3 hack/site-build.py
      # No page may load anything from another host: no fonts, no scripts,
      # no images, no trackers. Links (<a href>) are fine; the "Support"
      # buttons are such links.
      - name: No external requests
        run: |
          if grep -rnEi --include='*.html' --include='*.css' --include='*.js' \
              '(src|srcset|poster)\s*=\s*"(https?:)?//|<link[^>]+href\s*=\s*"(https?:)?//|url\(\s*["'"'"']?(https?:)?//|@import|<iframe|fetch\(|XMLHttpRequest|sendBeacon|new (Image|WebSocket|EventSource)' site/; then
            echo "::error::site/ loads something from another host, or could (see the lines above)."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write      # publish the site
      id-token: write   # prove to Pages that this workflow is the publisher
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
