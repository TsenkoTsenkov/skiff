# Builds Skiff for Apple Silicon on GitHub's own Macs and offers the disk
# image for download as an artifact of the run; for a tag like v0.1.0 it is
# also attached to a release. It runs when such a tag or a branch named
# release/... is pushed, and can be started by hand (Actions > macOS build >
# Run workflow), optionally with the unit tests.
#
# Ordinary pushes do not start it: on a private repository a Mac runner
# uses up the included Actions minutes ten times as fast as a Linux one.
name: macOS build

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Also run the unit tests on macOS
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dmg:
    name: Skiff.app and disk image (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: This is an Apple Silicon machine
        run: sw_vers && test "$(uname -m)" = arm64
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Build
        run: hack/macos-app.sh --dmg
      - name: The binary starts
        run: target/release/Skiff.app/Contents/MacOS/Skiff --version
      - uses: actions/upload-artifact@v4
        with:
          name: Skiff-macos-arm64
          path: target/release/Skiff-*.dmg
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/Skiff-*.dmg \
            --title "Skiff $GITHUB_REF_NAME" \
            --notes "Skiff for Apple Silicon Macs. The app is not notarized by Apple: after copying it to Applications, allow it once under System Settings > Privacy & Security (Open Anyway), or run: xattr -dr com.apple.quarantine /Applications/Skiff.app"

  tests:
    name: Unit tests on macOS
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      # (The tests that need a cluster or a GPU skip themselves or are left out.)
      - name: Tests
        run: cargo test -p skiff-core --lib -p skiff-term --lib -p skiff --lib
