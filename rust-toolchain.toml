# The toolchain CI and the release pipeline build with. rustup installs it
# on first use; Dependabot does not bump this file, so raise it by hand
# when a new stable is wanted (and keep `rust-version` in Cargo.toml as the
# oldest version that still builds).
[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
